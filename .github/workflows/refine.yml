name: Daily AI Refinement

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  refine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refine with Qwen
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node refine.js

      - name: Check if file changed
        id: check_changes
        run: |
          if git diff --quiet index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'AI refinement — daily improvements'
          title: '🤖 Daily AI Refinement'
          body: 'Automated improvements by Qwen. Review the Files Changed tab then click Merge to deploy.'
          branch: ai-refinement
          delete-branch: true